name: Build ReaMOD (macOS + Windows)

on:
  push:
    branches: [ "Main" ]
  pull_request:
    branches: [ "Main" ]
  workflow_dispatch: {}

permissions:
  contents: write

env:
  BUILD_TYPE: Release
  BUILD_DIR: ${{ github.workspace }}/build
  ARTIFACTS_DIR: ${{ github.workspace }}/artifacts

jobs:
  macos-universal:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Compute timestamps (human + tag-safe)
        run: |
          echo "STAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_ENV"
          echo "STAMP_TAG=$(date -u '+%Y%m%d-%H%M%S-UTC')" >> "$GITHUB_ENV"

      - name: Clean build + artifacts
        run: |
          rm -rf "${BUILD_DIR}" "${ARTIFACTS_DIR}"
          mkdir -p "${ARTIFACTS_DIR}"

      - name: Configure (CMake)
        run: >
          cmake -S . -B "${BUILD_DIR}"
          -G "Unix Makefiles"
          -DCMAKE_BUILD_TYPE="${BUILD_TYPE}"
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0

      - name: Build
        run: cmake --build "${BUILD_DIR}" --config "${BUILD_TYPE}" --parallel

      - name: Verify fat binary (arm64 + x86_64)
        run: |
          DYLIB="${BUILD_DIR}/reaper_ReaMOD_Plugin.dylib"
          if [ ! -f "$DYLIB" ]; then
            echo "ERROR: plugin dylib not found at $DYLIB"; exit 2
          fi
          lipo -info "$DYLIB"
          lipo -info "$DYLIB" | grep -q "arm64"   || { echo "Missing arm64 slice"; exit 3; }
          lipo -info "$DYLIB" | grep -q "x86_64" || { echo "Missing x86_64 slice"; exit 3; }

      - name: Verify RPATHs (relative only)
        run: |
          DYLIB="${BUILD_DIR}/reaper_ReaMOD_Plugin.dylib"
          RPATHS="$(otool -l "$DYLIB" | awk '/LC_RPATH/{flag=1;next}/Load command/{flag=0}flag' | awk '/path /{print $2}')"
          echo "Recorded RPATHs:"; echo "$RPATHS"
          echo "$RPATHS" | grep -qx "@loader_path" || { echo "Missing @loader_path"; exit 4; }
          echo "$RPATHS" | grep -qx "@loader_path/../ReaMOD/fmod/core/lib" || { echo "Missing core RPATH"; exit 4; }
          echo "$RPATHS" | grep -qx "@loader_path/../ReaMOD/fmod/studio/lib" || { echo "Missing studio RPATH"; exit 4; }
          if echo "$RPATHS" | grep -q '^/'; then
            echo "ERROR: Found absolute RPATH(s):"; echo "$RPATHS" | grep '^/'; exit 5
          fi

      - name: Package into Zip (macOS)
        run: |
          DYLIB="${BUILD_DIR}/reaper_ReaMOD_Plugin.dylib"
          ZIPFILE="${ARTIFACTS_DIR}/ReaMOD_Mac.zip"
          rm -f "$ZIPFILE"
          zip -j "$ZIPFILE" "$DYLIB"
          ls -lh "${ARTIFACTS_DIR}"

      - name: Upload artifact (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: ReaMOD-macos-universal
          path: ${{ env.ARTIFACTS_DIR }}/ReaMOD_Mac.zip

  windows-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Compute timestamps (human + tag-safe)
        shell: bash
        run: |
          echo "STAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_ENV"
          echo "STAMP_TAG=$(date -u '+%Y%m%d-%H%M%S-UTC')" >> "$GITHUB_ENV"

      - name: Clean build + artifacts
        shell: pwsh
        run: |
          if (Test-Path "$env:BUILD_DIR") { Remove-Item -Recurse -Force "$env:BUILD_DIR" }
          if (Test-Path "$env:ARTIFACTS_DIR") { Remove-Item -Recurse -Force "$env:ARTIFACTS_DIR" }
          New-Item -ItemType Directory -Force -Path "$env:ARTIFACTS_DIR" | Out-Null

      - name: Configure (CMake, MSVC x64)
        shell: pwsh
        run: >
          cmake -S . -B "$env:BUILD_DIR"
          -G "Visual Studio 17 2022"
          -A x64
          -DCMAKE_BUILD_TYPE="${env:BUILD_TYPE}"

      - name: Build (Release)
        shell: pwsh
        run: cmake --build "$env:BUILD_DIR" --config "$env:BUILD_TYPE" --parallel

      - name: Resolve plugin path (Windows)
        id: resolve_win
        shell: pwsh
        run: |
          $c1 = Join-Path "$env:BUILD_DIR" "reaper_ReaMOD_Plugin.dll"
          $c2 = Join-Path "$env:BUILD_DIR" "$env:BUILD_TYPE" "reaper_ReaMOD_Plugin.dll"
          if (Test-Path $c1) { "PLUGIN_DLL=$c1" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV }
          elseif (Test-Path $c2) { "PLUGIN_DLL=$c2" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV }
          else { Write-Error "Could not find built DLL at $c1 or $c2"; exit 2 }

      - name: Verify binary exists (Windows)
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:PLUGIN_DLL")) { Write-Error "Missing $env:PLUGIN_DLL"; exit 2 }
          Write-Host "Found: $env:PLUGIN_DLL"

      - name: Package into Zip (Windows)
        shell: pwsh
        run: |
          $ZIP = Join-Path "$env:ARTIFACTS_DIR" "ReaMOD_Windows.zip"
          if (Test-Path $ZIP) { Remove-Item -Force $ZIP }
          Compress-Archive -Path "$env:PLUGIN_DLL" -DestinationPath $ZIP
          Get-ChildItem "$env:ARTIFACTS_DIR" | Format-Table -AutoSize

      - name: Upload artifact (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: ReaMOD-windows-x64
          path: ${{ env.ARTIFACTS_DIR }}/ReaMOD_Windows.zip

  release:
    name: Create GitHub Release (mac + win)
    runs-on: ubuntu-latest
    needs: [macos-universal, windows-x64]
    if: github.ref == 'refs/heads/Main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Compute timestamps (human + tag-safe)
        run: |
          echo "STAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_ENV"
          echo "STAMP_TAG=$(date -u '+%Y%m%d-%H%M%S-UTC')" >> "$GITHUB_ENV"

      - name: Download mac artifact
        uses: actions/download-artifact@v4
        with:
          name: ReaMOD-macos-universal
          path: ./dl

      - name: Download windows artifact
        uses: actions/download-artifact@v4
        with:
          name: ReaMOD-windows-x64
          path: ./dl

      - name: List downloaded files
        run: ls -alh ./dl

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.STAMP_TAG }}-r${{ github.run_number }}
          name: "ReaMOD macOS + Windows — ${{ env.STAMP }}"
          draft: false
          prerelease: false
          body: |
            Automated build from CI.

            • Timestamp: ${{ env.STAMP }}
            • Run: #${{ github.run_number }}
            • Commit: ${{ github.sha }}

            Includes:
            - ReaMOD_Mac.zip (universal arm64 + x86_64 .dylib)
            - ReaMOD_Windows.zip (x64 .dll)
          files: |
            dl/ReaMOD_Mac.zip
            dl/ReaMOD_Windows.zip
          fail_on_unmatched_files: true
          overwrite_files: true
