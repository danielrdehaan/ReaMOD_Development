name: Build ReaMOD (macOS Universal)

on:
  push:
    branches: [ "Main" ]
  pull_request:
    branches: [ "Main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  macos-universal:
    runs-on: macos-latest

    env:
      BUILD_TYPE: Release
      BUILD_DIR: ${{ github.workspace }}/build
      ARTIFACTS_DIR: ${{ github.workspace }}/artifacts  # absolute path

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Compute timestamps (human + tag-safe)
        run: |
          echo "STAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_ENV"
          echo "STAMP_TAG=$(date -u '+%Y%m%d-%H%M%S-UTC')" >> "$GITHUB_ENV"

      - name: Clean build + artifacts
        run: |
          rm -rf "${BUILD_DIR}" "${ARTIFACTS_DIR}"
          mkdir -p "${ARTIFACTS_DIR}"

      - name: Configure (CMake)
        run: >
          cmake -S . -B "${BUILD_DIR}"
          -G "Unix Makefiles"
          -DCMAKE_BUILD_TYPE="${BUILD_TYPE}"
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0

      - name: Build
        run: cmake --build "${BUILD_DIR}" --config "${BUILD_TYPE}" --parallel

      - name: Verify fat binary (arm64 + x86_64)
        run: |
          DYLIB="${BUILD_DIR}/reaper_ReaMOD_Plugin.dylib"
          if [ ! -f "$DYLIB" ]; then
            echo "ERROR: plugin dylib not found at $DYLIB"; exit 2
          fi
          lipo -info "$DYLIB"
          lipo -info "$DYLIB" | grep -q "arm64"   || { echo "Missing arm64 slice"; exit 3; }
          lipo -info "$DYLIB" | grep -q "x86_64" || { echo "Missing x86_64 slice"; exit 3; }

      - name: Verify RPATHs (relative only)
        run: |
          DYLIB="${BUILD_DIR}/reaper_ReaMOD_Plugin.dylib"
          RPATHS="$(otool -l "$DYLIB" | awk '/LC_RPATH/{flag=1;next}/Load command/{flag=0}flag' | awk '/path /{print $2}')"
          echo "Recorded RPATHs:"; echo "$RPATHS"
          echo "$RPATHS" | grep -qx "@loader_path" || { echo "Missing @loader_path"; exit 4; }
          echo "$RPATHS" | grep -qx "@loader_path/../ReaMOD/fmod/core/lib" || { echo "Missing core RPATH"; exit 4; }
          echo "$RPATHS" | grep -qx "@loader_path/../ReaMOD/fmod/studio/lib" || { echo "Missing studio RPATH"; exit 4; }
          if echo "$RPATHS" | grep -q '^/'; then
            echo "ERROR: Found absolute RPATH(s):"; echo "$RPATHS" | grep '^/'; exit 5
          fi

      - name: Package into Zip
        run: |
          DYLIB="${BUILD_DIR}/reaper_ReaMOD_Plugin.dylib"
          ZIPFILE="${ARTIFACTS_DIR}/ReaMOD Reaper Extension for Mac.zip"
          rm -f "$ZIPFILE"
          zip -j "$ZIPFILE" "$DYLIB"
          ls -lh "${ARTIFACTS_DIR}"

      - name: Upload artifacts (Actions run)
        uses: actions/upload-artifact@v4
        with:
          name: ReaMOD-macos-universal
          path: ${{ env.ARTIFACTS_DIR }}/ReaMOD Reaper Extension for Mac.zip

      - name: Create GitHub Release (attach .zip)
        if: github.ref == 'refs/heads/Main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.STAMP_TAG }}-r${{ github.run_number }}
          name: "ReaMOD macOS Universal — ${{ env.STAMP }}"
          draft: false
          prerelease: false
          body: |
            Automated build from CI.

            • Timestamp: ${{ env.STAMP }}
            • Run: #${{ github.run_number }}
            • Commit: ${{ github.sha }}

            Includes:
            - ReaMOD Reaper Extension for Mac.zip (contains: reaper_ReaMOD_Plugin.dylib, universal arm64 + x86_64)
          files: ${{ env.ARTIFACTS_DIR }}/ReaMOD(Mac).zip
          fail_on_unmatched_files: true
          overwrite_files: true   # <-- correct key
