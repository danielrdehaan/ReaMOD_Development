# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  push:
    branches: [ "Main" ]
  pull_request:
    branches: [ "Main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following 3 configurations:
      # 1. <Windows, Release, latest MSVC compiler toolchain on the default runner image, default generator>
      # 2. <Linux, Release, latest GCC compiler toolchain on the default runner image, default generator>
      # 3. <Linux, Release, latest Clang compiler toolchain on the default runner image, default generator>
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the build_type list.
      matrix:
        os: [windows-latest, macos-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: macos-latest
            c_compiler: gcc
          - os: macos-latest
            c_compiler: cl

    steps:
      - uses: actions/checkout@v4
        with:
          clean: true        # scrub untracked files (including any stale build/)
  
      - name: Clean any pre‑existing build dir
        uses: JesseTG/rm@v1.0.3
        with:
          path: ${{ github.workspace }}/build
  
      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          # Convert backslashes to slashes for bash compatibility
          ws="${GITHUB_WORKSPACE//\\//}"
          echo "build-output-dir=$ws/build" >> "$GITHUB_OUTPUT"
          echo "workspace=$ws" >> "$GITHUB_OUTPUT"

      - name: Configure CMake
        shell: bash
        run: |
          cmake \
            -B "${{ steps.strings.outputs.build-output-dir }}" \
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -S "${{ steps.strings.outputs.workspace }}"

      - name: Build
        shell: bash
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

      - name: Test
        shell: bash
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        run: ctest --build-config ${{ matrix.build_type }}
      
      - name: Collect plugin artifacts
        shell: bash
        run: |
          rel_dir="${{ steps.strings.outputs.workspace }}/releases"
          mkdir -p "$rel_dir"
          find "${{ steps.strings.outputs.build-output-dir }}" -type f \( -name reaper_ReaMODPlugin.dll -o -name reaper_ReaMOD_Plugin.dylib \) -exec cp {} "$rel_dir/" \;

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReaMOD-${{ matrix.os }}-${{ matrix.build_type }}
          path: releases/**
