name: Build ReaMOD (macOS Universal)

on:
  push:
    branches: [ "Main" ]
  pull_request:
    branches: [ "Main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  macos-universal:
    runs-on: macos-latest

    env:
      BUILD_TYPE: Release
      BUILD_DIR: ${{ github.workspace }}/build
      ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
      RELEASES_DIR: ${{ github.workspace }}/releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true
          # fetch-depth: 0  # uncomment if you ever need full history

      - name: Compute timestamps (human + tag-safe)
        run: |
          echo "STAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_ENV"
          echo "STAMP_TAG=$(date -u '+%Y%m%d-%H%M%S-UTC')" >> "$GITHUB_ENV"

      - name: Clean build + artifacts + releases
        run: |
          rm -rf "${BUILD_DIR}" "${ARTIFACTS_DIR}" "${RELEASES_DIR}"
          mkdir -p "${ARTIFACTS_DIR}" "${RELEASES_DIR}"

      - name: Configure (CMake)
        run: >
          cmake -S . -B "${BUILD_DIR}"
          -G "Unix Makefiles"
          -DCMAKE_BUILD_TYPE="${BUILD_TYPE}"
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0

      - name: Build
        run: cmake --build "${BUILD_DIR}" --config "${BUILD_TYPE}" --parallel

      - name: Verify fat binary (arm64 + x86_64)
        run: |
          DYLIB="${BUILD_DIR}/reaper_ReaMOD_Plugin.dylib"
          if [ ! -f "$DYLIB" ]; then
            echo "ERROR: plugin dylib not found at $DYLIB"; exit 2
          fi
          lipo -info "$DYLIB"
          lipo -info "$DYLIB" | grep -q "arm64"   || { echo "Missing arm64 slice"; exit 3; }
          lipo -info "$DYLIB" | grep -q "x86_64" || { echo "Missing x86_64 slice"; exit 3; }

      - name: Verify RPATHs (relative only)
        run: |
          DYLIB="${BUILD_DIR}/reaper_ReaMOD_Plugin.dylib"
          RPATHS="$(otool -l "$DYLIB" | awk '/LC_RPATH/{flag=1;next}/Load command/{flag=0}flag' | awk '/path /{print $2}')"
          echo "Recorded RPATHs:"; echo "$RPATHS"
          echo "$RPATHS" | grep -qx "@loader_path" || { echo "Missing @loader_path"; exit 4; }
          echo "$RPATHS" | grep -qx "@loader_path/../ReaMOD/fmod/core/lib" || { echo "Missing core RPATH"; exit 4; }
          echo "$RPATHS" | grep -qx "@loader_path/../ReaMOD/fmod/studio/lib" || { echo "Missing studio RPATH"; exit 4; }
          if echo "$RPATHS" | grep -q '^/'; then
            echo "ERROR: Found absolute RPATH(s):"; echo "$RPATHS" | grep '^/'; exit 5
          fi

      - name: Empty releases dir (robust)
        run: |
          rm -rf "${RELEASES_DIR}"
          mkdir -p "${RELEASES_DIR}"

      - name: Place artifacts
        run: |
          cp "${BUILD_DIR}/reaper_ReaMOD_Plugin.dylib" "${ARTIFACTS_DIR}/reaper_ReaMOD_Plugin.dylib"
          cp "${BUILD_DIR}/reaper_ReaMOD_Plugin.dylib" "${RELEASES_DIR}/reaper_ReaMOD_Plugin.dylib"
          echo "Contents of releases/:"
          ls -lah "${RELEASES_DIR}"

      - name: Upload artifacts (Actions run)
        uses: actions/upload-artifact@v4
        with:
          name: ReaMOD-macos-universal
          path: |
            artifacts/reaper_ReaMOD_Plugin.dylib
            releases/reaper_ReaMOD_Plugin.dylib

      - name: Commit releases/ to the repo
        if: github.ref == 'refs/heads/Main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          add_options: -A
          file_pattern: releases/
          commit_message: >
            CI: macOS universal build - ${{ env.STAMP }}
            (run ${{ github.run_number }} @ ${{ github.sha }})

      # --- NEW: Create a GitHub Release with the .dylib attached ---
      - name: Create GitHub Release (attach .dylib)
        if: github.ref == 'refs/heads/Main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.STAMP_TAG }}-r${{ github.run_number }}
          name: "ReaMOD macOS Universal — ${{ env.STAMP }}"
          draft: false
          prerelease: false
          body: |
            Automated build from CI.

            • Timestamp: ${{ env.STAMP }}
            • Run: #${{ github.run_number }}
            • Commit: ${{ github.sha }}

            Includes:
            - reaper_ReaMOD_Plugin.dylib (universal: arm64 + x86_64)
          files: |
            artifacts/reaper_ReaMOD_Plugin.dylib
            releases/reaper_ReaMOD_Plugin.dylib
