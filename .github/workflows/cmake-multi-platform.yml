name: Build ReaMOD (macOS Universal)

on:
  push:
    branches: [ "Main" ]
  pull_request:
    branches: [ "Main" ]
  workflow_dispatch: {}

jobs:
  macos-universal:
    runs-on: macos-latest

    env:
      BUILD_TYPE: Release
      BUILD_DIR: ${{ github.workspace }}/build
      ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
      RELEASES_DIR: ${{ github.workspace }}/releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Clean build + artifacts + releases
        run: |
          rm -rf "${BUILD_DIR}" "${ARTIFACTS_DIR}" "${RELEASES_DIR}"
          mkdir -p "${ARTIFACTS_DIR}" "${RELEASES_DIR}"

      - name: Configure (CMake)
        run: >
          cmake -S . -B "${BUILD_DIR}"
          -G "Unix Makefiles"
          -DCMAKE_BUILD_TYPE="${BUILD_TYPE}"
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0

      - name: Build
        run: cmake --build "${BUILD_DIR}" --config "${BUILD_TYPE}" --parallel

      - name: Verify fat binary (arm64 + x86_64)
        run: |
          DYLIB="${BUILD_DIR}/reaper_ReaMOD_Plugin.dylib"
          if [ ! -f "$DYLIB" ]; then
            echo "ERROR: plugin dylib not found at $DYLIB"; exit 2
          fi
          echo "lipo -info $DYLIB"
          lipo -info "$DYLIB"
          lipo -info "$DYLIB" | grep -q "arm64"   || { echo "Missing arm64 slice"; exit 3; }
          lipo -info "$DYLIB" | grep -q "x86_64" || { echo "Missing x86_64 slice"; exit 3; }

      - name: Verify RPATHs (relative only)
        run: |
          DYLIB="${BUILD_DIR}/reaper_ReaMOD_Plugin.dylib"
          RPATHS="$(otool -l "$DYLIB" | awk '/LC_RPATH/{flag=1;next}/Load command/{flag=0}flag' | awk '/path /{print $2}')"
          echo "Recorded RPATHs:"; echo "$RPATHS"
          echo "$RPATHS" | grep -qx "@loader_path" || { echo "Missing @loader_path"; exit 4; }
          echo "$RPATHS" | grep -qx "@loader_path/../ReaMOD/fmod/core/lib" || { echo "Missing core RPATH"; exit 4; }
          echo "$RPATHS" | grep -qx "@loader_path/../ReaMOD/fmod/studio/lib" || { echo "Missing studio RPATH"; exit 4; }
          if echo "$RPATHS" | grep -q '^/'; then
            echo "ERROR: Found absolute RPATH(s):"; echo "$RPATHS" | grep '^/'; exit 5
          fi

      - name: Place artifacts
        run: |
          # Copy to artifacts/ for Actions artifact upload
          cp "${BUILD_DIR}/reaper_ReaMOD_Plugin.dylib" "${ARTIFACTS_DIR}/reaper_ReaMOD_Plugin.dylib"
          # Also copy to top-level releases/ folder in the repo workspace
          cp "${BUILD_DIR}/reaper_ReaMOD_Plugin.dylib" "${RELEASES_DIR}/reaper_ReaMOD_Plugin.dylib"
          echo "Contents of releases/:"
          ls -lah "${RELEASES_DIR}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReaMOD-macos-universal
          path: |
            artifacts/reaper_ReaMOD_Plugin.dylib
            releases/reaper_ReaMOD_Plugin.dylib
