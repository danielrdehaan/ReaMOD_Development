# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  push:
    branches: [ "multi-platform" ]
  pull_request:
    branches: [ "multi-platform" ]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Optional: cache the prepared fmod/ directory to speed up later runs.
      - name: Cache FMOD SDK
        id: cache-fmod
        uses: actions/cache@v4
        with:
          path: fmod
          key: fmod-${{ runner.os }}-v1

      - name: Prepare FMOD SDK (Windows)
        if: runner.os == 'Windows' && steps.cache-fmod.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not "${{ secrets.FMOD_WIN_URL }}") { throw "Missing secret FMOD_WIN_URL" }

          $zip = "$env:RUNNER_TEMP\fmod_win.zip"
          Invoke-WebRequest -Uri "${{ secrets.FMOD_WIN_URL }}" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\fmod_win"

          # Find the extracted root that contains 'api'
          $api = Get-ChildItem -Path "$env:RUNNER_TEMP\fmod_win" -Recurse -Directory |
                  Where-Object { Test-Path (Join-Path $_.FullName 'api') } |
                  Select-Object -First 1
          if (-not $api) { throw "Could not find FMOD 'api' directory in archive" }
          $sdk = Join-Path $api.FullName 'api'

          New-Item -ItemType Directory -Force -Path "fmod/core/inc","fmod/studio/inc","fmod/core/lib","fmod/studio/lib" | Out-Null

          Copy-Item "$sdk/core/inc/*" "fmod/core/inc" -Recurse
          Copy-Item "$sdk/studio/inc/*" "fmod/studio/inc" -Recurse

          # Copy x64 libs and rename to what CMake expects
          $coreLib = Get-Item "$sdk/core/lib/x64/fmod_vc.lib"
          $studioLib = Get-Item "$sdk/studio/lib/x64/fmodstudio_vc.lib"
          if (-not $coreLib) { throw "Missing fmod_vc.lib (x64) in FMOD archive" }
          if (-not $studioLib) { throw "Missing fmodstudio_vc.lib (x64) in FMOD archive" }

          Copy-Item $coreLib.FullName "fmod/core/lib/fmod.lib"
          Copy-Item $studioLib.FullName "fmod/studio/lib/fmodstudio.lib"

      - name: Prepare FMOD SDK (macOS)
        if: runner.os == 'macOS' && steps.cache-fmod.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          : "${{ secrets.FMOD_MAC_URL:?Missing secret FMOD_MAC_URL }}"
          curl -L "${{ secrets.FMOD_MAC_URL }}" -o "$RUNNER_TEMP/fmod_mac.zip"
          unzip -q "$RUNNER_TEMP/fmod_mac.zip" -d "$RUNNER_TEMP/fmod_mac"

          SDK_DIR="$(find "$RUNNER_TEMP/fmod_mac" -maxdepth 3 -type d -name api | head -n1)"
          if [ -z "${SDK_DIR:-}" ]; then
            echo "Could not find FMOD 'api' directory in archive" >&2
            exit 1
          fi

          mkdir -p fmod/core/inc fmod/studio/inc fmod/core/lib fmod/studio/lib

          cp -R "$SDK_DIR/core/inc/"* fmod/core/inc/
          cp -R "$SDK_DIR/studio/inc/"* fmod/studio/inc/

          # dylibs are usually in api/*/lib/
          cp "$SDK_DIR/core/lib/libfmod.dylib" fmod/core/lib/
          cp "$SDK_DIR/studio/lib/libfmodstudio.dylib" fmod/studio/lib/

      - name: Prepare FMOD SDK (Linux)
        if: runner.os == 'Linux' && steps.cache-fmod.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          : "${{ secrets.FMOD_LINUX_URL:?Missing secret FMOD_LINUX_URL }}"
          curl -L "${{ secrets.FMOD_LINUX_URL }}" -o "$RUNNER_TEMP/fmod_linux.tar.gz"
          mkdir -p "$RUNNER_TEMP/fmod_linux"
          tar -xzf "$RUNNER_TEMP/fmod_linux.tar.gz" -C "$RUNNER_TEMP/fmod_linux"

          SDK_DIR="$(find "$RUNNER_TEMP/fmod_linux" -maxdepth 4 -type d -name api | head -n1)"
          if [ -z "${SDK_DIR:-}" ]; then
            echo "Could not find FMOD 'api' directory in archive" >&2
            exit 1
          fi

          mkdir -p fmod/core/inc fmod/studio/inc fmod/core/lib fmod/studio/lib

          cp -R "$SDK_DIR/core/inc/"* fmod/core/inc/
          cp -R "$SDK_DIR/studio/inc/"* fmod/studio/inc/

          # .so files are typically in api/*/lib/x86_64/
          if [ -f "$SDK_DIR/core/lib/x86_64/libfmod.so" ]; then
            cp "$SDK_DIR/core/lib/x86_64/libfmod.so" fmod/core/lib/
          else
            cp "$SDK_DIR/core/lib/libfmod.so" fmod/core/lib/
          fi
          if [ -f "$SDK_DIR/studio/lib/x86_64/libfmodstudio.so" ]; then
            cp "$SDK_DIR/studio/lib/x86_64/libfmodstudio.so" fmod/studio/lib/
          else
            cp "$SDK_DIR/studio/lib/libfmodstudio.so" fmod/studio/lib/
          fi

      # Now run your existing CMake configure/generate/build steps
      - name: Configure CMake
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release --parallel